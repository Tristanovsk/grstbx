# Conda environment for grstbx (run from the root of the repository):
#   conda env create -f environment.yml
#   conda activate grstbx
# The compiled geospatial libraries (GDAL, PROJ, GEOS) and xesmf (ESMF) come from conda-forge;
# grstbx itself is installed in editable mode with pip.
name: grstbx
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  # arrays and datacubes
  - numpy>=1.24
  - scipy>=1.10
  - pandas>=2.0
  - xarray>=2025.6.1
  - dask>=2024.1
  - zarr>=3
  - netcdf4>=1.6
  - importlib_resources>=5.10
  # geospatial
  - gdal
  - affine>=2.4
  - pyproj>=3.6
  - shapely>=2.0
  - geopandas>=0.14
  - rasterio>=1.3
  - rioxarray>=0.15
  - xesmf>=0.8
  # plotting and interactive viewers
  - matplotlib>=3.7
  - cartopy>=0.22
  - bokeh>=3.3
  - holoviews>=1.18
  - datashader>=0.16
  - colorcet>=3.0
  - param>=2.0
  - panel>=1.3
  - scikit-learn>=1.3
  # notebooks
  - jupyterlab>=4
  - ipykernel>=6
  - jupyter_bokeh>=4
  - pip:
      - -e .
