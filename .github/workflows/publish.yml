# Build grstbx and publish it on PyPI with Trusted Publishing (no API token stored).
#   - push a tag vX.Y.Z (equal to grstbx.__version__)  -> PyPI, then GitHub release
#   - run the workflow manually (Actions tab)           -> TestPyPI
# The GitHub release is created once the package is on PyPI, with the wheel and sdist attached and
# the notes of .github/release-notes/vX.Y.Z.md (notes generated from the commits if the file is absent).
# One-time setup: on pypi.org and test.pypi.org, add a trusted publisher for
# owner Tristanovsk, repository grstbx, workflow publish.yml, and environment pypi / testpypi.
name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check --strict dist/*
      - name: Check that the tag matches the package version
        if: github.ref_type == 'tag'
        run: |
          version=$(tar -xzOf dist/grstbx-*.tar.gz --wildcards '*/PKG-INFO' | sed -n 's/^Version: //p' | head -n1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    if: github.ref_type == 'tag'
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            notes_option=(--notes-file "$notes")
          else
            notes_option=(--generate-notes)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "grstbx ${GITHUB_REF_NAME}" \
            "${notes_option[@]}"
